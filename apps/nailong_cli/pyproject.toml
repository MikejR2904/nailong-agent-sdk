[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nailong-cli"
version = "0.1.0"
description = "Interactive command line for nailong-agent-sdk: a coding agent with approvals, sandboxing, sessions and reviewed tool creation"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nailong-agent-sdk", "prompt_toolkit>=3.0,<4", "rich>=13", "keyring>=25"]

[project.scripts]
nailong = "nailong_cli.cli:main"

[tool.uv.sources]
nailong-agent-sdk = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.16.8"]

[tool.pytest.ini_options]
pythonpath = [".", "../../src"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["nailong_cli"]
