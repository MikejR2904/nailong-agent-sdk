[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nailong-agent-sdk"
version = "0.1.0"
description = "Extensible Python BaseAgent runtime, grounded retrieval, governed orchestration, deterministic controller, profiling, verification gates, and MCP harness for the Agent-Assisted Design framework"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "David Michael Indraputra" }]
keywords = ["agent", "asic", "eda", "mcp", "rtl", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "jsonschema-specifications>=2023.3.6",
  "mcp[cli]>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pypdf[image]>=5.0,<6",
  "pypdfium2>=4.30,<5",
  "python-docx>=1.1,<2",
  "pyyaml>=6.0,<7",
  "referencing>=0.28.4",
  "starlette>=0.27",
  "uvicorn>=0.31.1",
]

[project.scripts]
nailong-agent-sdk-dev = "nailong_agent_sdk.developer_tools.cli:main"

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2,<2",
]
langchain = [
    "langchain>=1.2,<2",
    "langchain-core>=1.4,<2",
]
jev = [
    "typesafe-sdk>=0.7,<1",
]
signatures = [
    "cryptography>=43",
]
redis-cache = [
    "redis>=5,<7",
]
interop = [
    "langchain>=1.2,<2",
    "langchain-core>=1.4,<2",
    "langgraph>=1.2,<2",
    "typesafe-sdk>=0.7,<1",
]

[dependency-groups]
dev = [
  "coverage>=7.6",
  "cryptography>=43",
  "mypy>=1.13",
  "pytest>=8.3,<9",
  "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
markers = [
    "docker: needs a reachable Docker daemon; skipped when none answers",
    "os_sandbox: needs Linux bubblewrap or macOS sandbox-exec; skipped elsewhere",
    "live: makes real model API calls (needs FIREWORKS_API_KEY; skipped without it); deselect with -m 'not live'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/nailong_agent_sdk/__init__.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["src/nailong_agent_sdk"]

[tool.mypy]
python_version = "3.12"
files = ["src/nailong_agent_sdk"]
ignore_missing_imports = true
warn_unused_ignores = true

# These files still had type errors (191 in all) when this list was written. Every other
# file must stay clean. Take a name off the list when its file is fixed; do not add one.
[[tool.mypy.overrides]]
module = [
  "nailong_agent_sdk.agent.base_agent.agent",
  "nailong_agent_sdk.agent.elastic_context",
  "nailong_agent_sdk.agent.openai_compatible.chat",
  "nailong_agent_sdk.agent.orchestrator.orchestrator",
  "nailong_agent_sdk.agent.retention",
  "nailong_agent_sdk.agent.retention_inventory",
  "nailong_agent_sdk.agent.runtime",
  "nailong_agent_sdk.agent.task_files",
  "nailong_agent_sdk.agent.task_runner",
  "nailong_agent_sdk.agent.verification",
  "nailong_agent_sdk.developer_tools.attribute_lineage",
  "nailong_agent_sdk.developer_tools.attribute_root_cause",
  "nailong_agent_sdk.developer_tools.cli",
  "nailong_agent_sdk.developer_tools.decision_links",
  "nailong_agent_sdk.developer_tools.diagnose",
  "nailong_agent_sdk.foundations.atomic_io",
  "nailong_agent_sdk.foundations.contracts",
  "nailong_agent_sdk.foundations.detached",
  "nailong_agent_sdk.integrations.langchain",
  "nailong_agent_sdk.integrations.langgraph",
  "nailong_agent_sdk.mcp.client",
  "nailong_agent_sdk.mcp.security",
  "nailong_agent_sdk.mcp.server",
  "nailong_agent_sdk.memory.episode_store",
  "nailong_agent_sdk.memory.episodes",
  "nailong_agent_sdk.memory.semantic_compaction",
  "nailong_agent_sdk.observability.attestation",
  "nailong_agent_sdk.observability.audit_log",
  "nailong_agent_sdk.observability.otlp",
  "nailong_agent_sdk.observability.recorder.core",
  "nailong_agent_sdk.observability.run_checkpoints",
  "nailong_agent_sdk.observability.telemetry_models",
  "nailong_agent_sdk.observability.witness",
  "nailong_agent_sdk.specifications.retrieval",
  "nailong_agent_sdk.starter.planner",
  "nailong_agent_sdk.state.graph",
  "nailong_agent_sdk.state.harness_coordinator",
  "nailong_agent_sdk.state.project_state_engine",
  "nailong_agent_sdk.tools.approvals",
  "nailong_agent_sdk.tools.artifact_anchor",
  "nailong_agent_sdk.tools.core.definitions",
  "nailong_agent_sdk.tools.core.helpers",
  "nailong_agent_sdk.tools.policy",
  "nailong_agent_sdk.tools.process_freeze",
  "nailong_agent_sdk.tools.supervisor",
]
ignore_errors = true
