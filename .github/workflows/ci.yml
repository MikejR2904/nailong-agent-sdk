name: ci

on:
  push:
    branches: [master, nailong-cli]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/nailong_cli/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . -e apps/nailong_cli
      - run: python -m ruff check src tests apps/nailong_cli
      - run: python -m ruff format --check src tests apps/nailong_cli
      - name: Types (SDK; files on the debt list in pyproject.toml are skipped)
        run: python -m mypy
      - name: Types (CLI)
        run: python -m mypy --config-file apps/nailong_cli/pyproject.toml apps/nailong_cli/nailong_cli

  test:
    name: sdk tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e ".[langgraph]" "langchain-core>=1.4,<2"
      - run: python -m pytest -m "not docker" -rfEs --durations=15 --junitxml=sdk-report.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-report-${{ matrix.os }}-${{ matrix.python }}
          path: sdk-report.xml
          if-no-files-found: ignore

  cli:
    name: cli tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/nailong_cli/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . -e apps/nailong_cli
      - name: Test the CLI and report coverage
        working-directory: apps/nailong_cli
        run: |
          python -m coverage run --source=nailong_cli -m pytest -rfEs --durations=15
          python -m coverage report --skip-empty

  package:
    name: build and install the wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --outdir dist .
      - run: python -m build --wheel --outdir dist apps/nailong_cli
      - name: Install both wheels in a clean environment and run the program
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/clean/bin/nailong --version
          /tmp/clean/bin/nailong --health --output json
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl

  os-sandbox:
    name: bubblewrap sandbox (best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        continue-on-error: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e ".[langgraph]" "langchain-core>=1.4,<2"
      - run: bwrap --ro-bind / / --dev /dev --proc /proc true
      - run: python -m pytest tests/tools/test_sandboxes.py -rfEs

  docker:
    name: docker sandbox against a real daemon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAILONG_DOCKER_TESTS_PULL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: docker version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e ".[langgraph]" "langchain-core>=1.4,<2"
      - run: python -m pytest -m docker -rfEs
